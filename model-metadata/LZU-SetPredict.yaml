designated_model: false
data_inputs: "中国疾控中心每周《全国急性呼吸道传染病哨点监测情况》中的门急诊流感样病例新冠阳性率，取 Hub target-data 的 wk inc covid prop ili（CN，周一）。"
methods: "集合预测。只用最近20周阳性率，点预报截断到0–100，23个分位数都等于该点。"
methods_long: "使用镜像 registry-vpc.miracle.ac.cn/gznl/sentinel_model:v1.5.0 中的 SetPredictModel。将 Hub 的全国哨点 ILI 新冠阳性率周序列按时间顺序写入「新增确诊」，一行一周；只用最近 20 周；人口总数固定为 1400000000，只作为动力模型的尺度参数。预报覆盖 horizon -1 到 6。该成员只返回一条轨迹，23 个分位数都等于对应周的点预报，并截断到 0–100。模型原始输出是感染人数动力系统的逐步新增，不是阳性率的生成模型，因此 designated_model 为 false，不进入 Hub 集成。"
ensemble_of_models: false
ensemble_of_hub_models: false
