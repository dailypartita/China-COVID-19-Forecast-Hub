data_inputs: "中国疾控中心每周发布的《全国急性呼吸道传染病哨点监测情况》报告的门急诊流感样病例中的新型冠状病毒阳性率"
methods: "Mean of statsforecast AutoARIMA and AutoETS point forecasts; 95% prediction intervals converted to 23 quantiles, retrained weekly"
methods_long: "Two classical statistical models are fitted to the full positivity series each week using the statsforecast package: an automatically selected ARIMA (AutoARIMA, non-seasonal stepwise search) and an automatically selected exponential smoothing model (AutoETS). The point forecast is the mean of the two models' forecasts at each horizon. The models' 95% prediction intervals are converted to a standard deviation per horizon (interval width divided by 2*1.96), averaged across the two models, and mapped onto the 23 hub quantile levels through a normal approximation, so the intervals widen naturally with the horizon. On the team's 126-origin rolling backtest (2024-04 to 2026-08) the model is conservatively calibrated (95% nominal coverage 100%) with overall WIS 2.36; it contributes diversity to the GZNL-VincentAvg ensemble rather than being competitive on its own."
