data_inputs: "中国疾控中心每周发布的《全国急性呼吸道传染病哨点监测情况》报告的门急诊流感样病例中的新型冠状病毒阳性率"
methods: "Two-sided generalised-Gaussian wave shape whose decline width is tied to the observed rise, with the rise/fall ratio calibrated on completed waves"
methods_long: "Every completed wave in this series is close to mirror-symmetric about its peak, with a decline only about 1.5 times wider than the rise and little spread across waves. The ongoing wave is therefore described by a two-sided generalised Gaussian, y(t) = base + amp * exp(-(|t - t_peak| / s)^beta) with s = s_rise before the peak and s = rho * s_rise after it, fitted by penalised least squares. The penalty carries a prior on rho and beta that is calibrated on the completed waves of the history rather than fixed, so soon after a peak the decline is essentially the mirror of the already-observed rise, and the data take over as post-peak weeks accumulate. The forecast level is rescaled onto the most recent observations, since a smooth curve cannot pass exactly through the latest point and that offset dominates short-horizon error. Predictive quantiles come from a Monte-Carlo ensemble of wave parameters, propagating uncertainty in peak height, peak timing, rho and beta, with residual noise applied on a variance-stabilising power scale so the lower quantiles stay off zero. This replaces an earlier version that forced the decline out to a fixed 16 weeks past the peak regardless of the rise; on a 119-origin rolling backtest the change lowers mean WIS from 5.78 to 2.45 and brings 50/80/95% interval coverage from 14/28/40% to 52/73/88%."
