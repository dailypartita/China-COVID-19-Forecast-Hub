methods: "Equal-weight Vincent averaging (linear pool) of the quantile forecasts of GZNL NextWave, QuantileBoost and Statistical"
methods_long: "The model combines the three other GZNL submissions — NextWave (wave-shape model), QuantileBoost (XGBoost quantile regression) and Statistical (AutoARIMA + AutoETS) — by averaging their predictive quantiles at each of the 23 hub quantile levels (Vincent averaging, i.e. a linear opinion pool with equal weights). Averaging quantiles level by level preserves the monotonicity of each member's distribution. The members are deliberately diverse: a mechanistic wave-shape model with Monte-Carlo parameter uncertainty, a machine-learning quantile regressor with the lowest median error but narrow raw intervals, and a classical statistical model with conservative intervals. On the team's 126-origin rolling backtest (2024-04 to 2026-08) the ensemble achieves the lowest overall WIS (1.80, 24% below NextWave alone), leads in all four epidemic phases (rise/peak/fall/low), and its 50/80/95% interval coverage (66/87/97%) is close to nominal. Weights are currently equal; accuracy-based weighting inversely proportional to recent WIS is planned once more hub evaluation data accumulate."
