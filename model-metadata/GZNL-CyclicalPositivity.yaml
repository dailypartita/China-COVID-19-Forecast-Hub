data_inputs: "中国疾控中心每周发布的《全国急性呼吸道传染病哨点监测情况》报告的门急诊流感样病例中的新型冠状病毒阳性率"
methods: "Scenario forecast based on cyclical evolution of COVID positivity waves (peak plateau, wave width, platform length)"
methods_long: "Detects epidemic waves when weekly COVID positivity among ILI cases exceeds 5%, then extrapolates wave morphology from historical OLS trends: recent peak plateau (~21.4%), wave duration (5.0 + 3.29m weeks), and inter-wave low-activity platform length (-3.0 + 9.6k weeks). The baseline scenario forecasts post-peak wide cosine decline toward the low-epidemic platform, following the cyclical evolution analysis of sentinel positivity dynamics."
